<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Research Overview | Hanfeng Zhai</title>
  <link rel="icon" href="/css/images/site/favicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles/site-fonts.css?v=6">
  <link rel="stylesheet" href="/css/styles/intro-nav.css?v=8">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--page-bg, #f5f0e4);
    }

    .overview-stage {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px var(--site-gutter, clamp(24px, 3vw, 56px)) 36px;
      box-sizing: border-box;
    }

    .overview-header {
      width: 100%;
      text-align: center;
      margin: 0 0 20px;
      padding: 0 0 10px;
      border-bottom: 1px solid #dcd4c4;
    }

    .overview-header h1 {
      margin: 0 0 6px;
      font-family: 'TeX Gyre Pagella', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
      font-size: 26px;
      font-weight: 700;
      font-variant: small-caps;
      font-feature-settings: "smcp" 1;
      letter-spacing: 0.05em;
      line-height: 1.25;
      color: #1a1815;
    }

    .overview-back {
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(140, 21, 21, 0.65);
    }

    .overview-back a {
      color: #8C1515;
      text-decoration: none;
    }

    .overview-back a:hover,
    .overview-back a:focus-visible {
      color: #5c0c0c;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .overview-frame {
      margin: 0;
      border: 1px solid #d8d0c0;
      border-radius: 0;
      background: #fff;
      padding: 12px;
      max-width: min(1440px, 100%);
      box-sizing: border-box;
      box-shadow: none;
    }

    .overview-frame img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <nav class="intro-inline-nav site-pill-nav" aria-label="Site sections">
    <div class="intro-nav-bar">
      <a class="intro-nav-link" href="/">Home</a>
      <a class="intro-nav-link intro-nav-link-active" href="/research/" aria-current="page">Research</a>
      <a class="intro-nav-link" href="/talk">Talks</a>
      <a class="intro-nav-link" href="/note">Notes</a>
      <a class="intro-nav-link" href="/code">Code</a>
    </div>
  </nav>
  <main class="overview-stage">
    <header class="overview-header">
      <h1>Research Overview</h1>
      <span class="overview-back">[<a href="/research/">← Back to Research</a>]</span>
    </header>
    <figure class="overview-frame">
      <img src="/assets/img/research/research.png" alt="Multiscale research overview schematic">
    </figure>
  </main>
  <script src="/js/intro-nav.js?v=5"></script>
</body>
</html>
