<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>MSG plasticity and hydrogen trapping | Hanfeng Zhai</title>
  <meta name="description" content="Interactive MSG plasticity and hydrogen trapping examples (Streamlit via stlite)." />
  <link rel="icon" href="/css/images/site/favicon.jpg" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css"
  />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    #root {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

    mount(
      {
        requirements: ["matplotlib", "numpy", "scipy"],
        entrypoint: "streamlit_app.py",
        files: {
          "streamlit_app.py": { url: "./HydrogenMSG/streamlit_app.py" },
          "msg_hydrogen.py": { url: "./HydrogenMSG/msg_hydrogen.py" },
          "fem_msg.py": { url: "./HydrogenMSG/fem_msg.py" },
          "fem_slit.py": { url: "./HydrogenMSG/fem_slit.py" },
          "_style.py": { url: "./HydrogenMSG/_style.py" },
          "_fem_plots.py": { url: "./HydrogenMSG/_fem_plots.py" },
        },
        streamlitConfig: {
          "client.toolbarMode": "viewer",
          "browser.gatherUsageStats": false,
        },
      },
      document.getElementById("root"),
    );
  </script>
</body>
</html>
