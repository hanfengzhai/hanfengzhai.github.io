<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Size-dependent hydrogen trapping in MSG plasticity | Hanfeng Zhai</title>
  <meta name="description" content="Interactive examples of size-dependent hydrogen trapping in mechanism-based strain gradient plasticity (Streamlit via stlite)." />
  <link rel="icon" href="/css/images/site/favicon.jpg" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css"
  />
  <style>
    :root {
      --bg: #e4e9ee;
      --ink: #1e293b;
      --muted: #64748b;
      --line: #c5ced8;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #root {
      width: 100%;
      height: 100%;
      background: var(--bg);
    }

    /* Hide Streamlit corner chrome only. Never delete those nodes. */
    [data-testid="stStatusWidget"],
    [data-testid="stToolbar"],
    [data-testid="stToolbarActions"],
    [data-testid="stDecoration"],
    [data-testid="stToast"],
    [data-testid="stToastContainer"],
    [data-testid="stNotification"],
    [data-testid="stBaseButton-header"],
    .stAppDeployButton,
    header [data-testid="stToolbar"],
    header [data-testid="stStatusWidget"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #boot {
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.1rem;
      padding: clamp(1.5rem, 6vw, 4rem);
      background: var(--bg);
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #boot.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #boot .kicker {
      margin: 0;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #boot h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3.2vw, 2.4rem);
      font-weight: 600;
      line-height: 1.2;
      max-width: 18ch;
    }
    #boot .detail {
      margin: 0;
      font-size: clamp(1rem, 1.6vw, 1.15rem);
      color: #334155;
      min-height: 1.5em;
    }
    #boot .bar-wrap {
      width: min(920px, 100%);
      height: 22px;
      border-radius: 999px;
      background: #d7dee6;
      border: 1px solid var(--line);
      overflow: hidden;
    }
    #boot .bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #820000 0%, #8c1515 55%, #b1040e 100%);
      transition: width 0.4s ease;
    }
    #boot .meta {
      display: flex;
      justify-content: space-between;
      width: min(920px, 100%);
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
      color: var(--muted);
    }
    #boot-retry {
      display: none;
      margin-top: 0.35rem;
      align-self: flex-start;
      padding: 0.55rem 1.1rem;
      border: 1px solid #8c1515;
      border-radius: 6px;
      background: #fff;
      color: #8c1515;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #boot-retry.visible {
      display: inline-flex;
    }
  </style>
</head>
<body>
  <div id="boot" aria-live="polite">
    <p class="kicker">Size-dependent hydrogen trapping</p>
    <h1>Loading MSG plasticity examples</h1>
    <p class="detail" id="boot-detail">Preparing the browser Python runtime…</p>
    <div class="bar-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="boot-bar-wrap">
      <div class="bar" id="boot-bar"></div>
    </div>
    <div class="meta">
      <span id="boot-step">1 / 6</span>
      <span id="boot-pct">0%</span>
    </div>
    <button type="button" id="boot-retry">Retry load</button>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

    const boot = document.getElementById("boot");
    const detail = document.getElementById("boot-detail");
    const bar = document.getElementById("boot-bar");
    const barWrap = document.getElementById("boot-bar-wrap");
    const pctEl = document.getElementById("boot-pct");
    const stepEl = document.getElementById("boot-step");
    const retryBtn = document.getElementById("boot-retry");
    const root = document.getElementById("root");

    let current = 0;
    let finished = false;

    const setProgress = (value, message, step) => {
      if (finished) return;
      current = Math.max(current, Math.min(99, value));
      bar.style.width = `${current}%`;
      barWrap.setAttribute("aria-valuenow", String(Math.round(current)));
      pctEl.textContent = `${Math.round(current)}%`;
      if (message) detail.textContent = message;
      if (step) stepEl.textContent = `${step} / 6`;
    };

    const fail = (err) => {
      finished = true;
      detail.textContent = `Failed to start: ${err?.message || err}`;
      pctEl.textContent = "error";
      stepEl.textContent = "failed";
      retryBtn.classList.add("visible");
      console.error(err);
    };

    const appIsReady = () => {
      // Require sidebar / page chrome that only appears after Streamlit paints.
      const text = (root.textContent || "").replace(/\s+/g, " ");
      const hasChrome =
        text.includes("Size-dependent hydrogen trapping") ||
        text.includes("Explore the constitutive chain") ||
        text.includes("Logical workflow") ||
        text.includes("Wire torsion") ||
        text.includes("Surface strain");
      const hasWidget =
        !!root.querySelector('[data-testid="stSidebar"]') ||
        !!root.querySelector('[data-testid="stAppViewContainer"]') ||
        !!root.querySelector(".stApp");
      return hasChrome && hasWidget;
    };

    const finish = () => {
      if (finished) return;
      finished = true;
      current = 100;
      bar.style.width = "100%";
      pctEl.textContent = "100%";
      stepEl.textContent = "6 / 6";
      detail.textContent = "Ready";
      retryBtn.classList.remove("visible");
      window.setTimeout(() => boot.classList.add("hidden"), 250);
    };

    retryBtn.addEventListener("click", () => {
      window.location.reload();
    });

    const stages = [
      [8, "Loading stlite runtime…", 1, 0],
      [20, "Starting Pyodide…", 2, 1200],
      [42, "Installing NumPy…", 3, 2800],
      [68, "Installing Matplotlib…", 4, 5600],
      [84, "Starting Streamlit…", 5, 9000],
      [93, "Rendering the first example…", 6, 12500],
    ];
    for (const [value, message, step, delay] of stages) {
      window.setTimeout(() => setProgress(value, message, step), delay);
    }

    const creep = window.setInterval(() => {
      if (finished || current >= 97) return;
      setProgress(current + 0.25);
    }, 650);

    const readyPoll = window.setInterval(() => {
      if (!appIsReady()) return;
      window.clearInterval(creep);
      window.clearInterval(readyPoll);
      finish();
    }, 400);

    // Safety: never leave the user on the loader forever.
    // Do not treat bare DOM insertion as readiness.
    window.setTimeout(() => {
      window.clearInterval(creep);
      window.clearInterval(readyPoll);
      if (!finished) {
        if (appIsReady()) finish();
        else fail(
          "The app never became ready. Use Retry load, hard-refresh, or the native Streamlit app on port 8502."
        );
      }
    }, 90000);

    try {
      mount(
        {
          requirements: ["numpy", "matplotlib", "pillow", "plotly"],
          entrypoint: "streamlit_app.py",
          files: {
            "streamlit_app.py": { url: "./HydrogenMSG/streamlit_app.py?v=49" },
            "msg_hydrogen.py": { url: "./HydrogenMSG/msg_hydrogen.py?v=49" },
            "fem_msg.py": { url: "./HydrogenMSG/fem_msg.py?v=49" },
            "fem_slit.py": { url: "./HydrogenMSG/fem_slit.py?v=49" },
            "_style.py": { url: "./HydrogenMSG/_style.py" },
            "_fem_plots.py": { url: "./HydrogenMSG/_fem_plots.py?v=49" },
            "_fem.py": { url: "./HydrogenMSG/_fem.py?v=49" },
            "_app_schematics.py": { url: "./HydrogenMSG/_app_schematics.py?v=49" },
            "_bunny_contour.py": { url: "./HydrogenMSG/_bunny_contour.py?v=49" },
            "bunny.npz": { url: "./HydrogenMSG/bunny.npz?v=40" },
            ".streamlit/config.toml": { url: "./HydrogenMSG/.streamlit/config.toml" },
          },
          streamlitConfig: {
            "client.toolbarMode": "minimal",
            "browser.gatherUsageStats": false,
            "theme.base": "light",
            "theme.primaryColor": "#8C1515",
            "theme.backgroundColor": "#E4E9EE",
            "theme.secondaryBackgroundColor": "#F1F4F7",
            "theme.textColor": "#1E293B",
            "theme.font": "sans serif",
          },
        },
        root,
      );
    } catch (err) {
      window.clearInterval(creep);
      window.clearInterval(readyPoll);
      fail(err);
    }
  </script>
</body>
</html>
