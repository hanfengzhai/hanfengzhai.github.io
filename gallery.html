    <article class="scrolling-card viz-card">

      <figure>
        <img src="/assets/img/gallery/simulations/graphenecrack.gif" alt="" loading="lazy">

      </figure>
    </article>
    <article class="scrolling-card viz-card">
      <figure>
        <img src="/assets/img/gallery/simulations/dentein.gif" alt="" loading="lazy">

    </article>
    <article class="scrolling-card viz-card">
      <figure>
        <img src="/assets/img/gallery/simulations/PoissonProcess.gif" alt="" loading="lazy">

    </article>
    <article class="scrolling-card viz-card">
      <figure>

      </figure>
    </article>
    <article class="scrolling-card viz-card">
      <figure>
        <img src="/assets/img/gallery/simulations/singlebubble.gif" alt="" loading="lazy">

    <article class="scrolling-card viz-card">
      <figure>
